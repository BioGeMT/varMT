services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: varmt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - varmt-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d varmt"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: varmt-app
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${VARMT_PORT:-8502}:8501"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  varmt-db:
