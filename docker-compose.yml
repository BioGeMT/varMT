services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: varmt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - varmt-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d varmt"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: varmt-app
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      VARMT_URL: ${VARMT_URL:-http://localhost:8502}
      VARMT_CLIENT_SECRET: ${VARMT_CLIENT_SECRET:?Set VARMT_CLIENT_SECRET in .env}
      VARMT_COOKIE_SECRET: ${VARMT_COOKIE_SECRET:?Set VARMT_COOKIE_SECRET in .env}
    ports:
      - "${VARMT_PORT:-8502}:8501"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm # TODO switch to "start" for production
    environment:
      VARMT_URL: ${VARMT_URL:-http://localhost:8502}
      VARMT_CLIENT_SECRET: ${VARMT_CLIENT_SECRET:?Set VARMT_CLIENT_SECRET in .env}
      # Browsers use the public address; the app container reaches Keycloak at keycloak:8080
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  varmt-db:
  keycloak-db:
